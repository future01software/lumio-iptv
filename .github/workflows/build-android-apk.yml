name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

# CI check only: builds a debug-signed APK as a downloadable artifact. Real
# releases are signed on the release machine and published to lumio-releases.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ubuntu-latest already ships the Android SDK (ANDROID_HOME is set)
      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Expo prebuild
        working-directory: frontend
        run: npx expo prebuild --platform android --clean --no-install
        env:
          CI: 1

      # Release build bundles the JS inside the APK, so it runs standalone on the phone.
      # It is signed with the debug keystore, so it installs directly.
      - name: Build Android APK (release)
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.enableMinifyInReleaseBuilds=false \
            -PreactNativeArchitectures=arm64-v8a,armeabi-v7a \
            -Dorg.gradle.jvmargs=-Xmx4g
        env:
          NODE_ENV: production

      - name: Rename APK
        run: |
          mkdir -p out
          for f in frontend/android/app/build/outputs/apk/release/*.apk; do
            cp "$f" "out/lumio-iptv-ci${{ github.run_number }}-$(basename "$f")"
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lumio-iptv-apk
          path: out/*.apk
          retention-days: 30
